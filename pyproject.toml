[project]
name = "deflector"
version = "1.0.0"
description = "A grounded support-deflection microservice: cited RAG answers with a calibrated confidence gate."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deflector = "deflector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deflector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
